# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - AegisAOSoft

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 'Install server dependencies'
        run: |
          cd server
          npm install
          echo "✅ Server dependencies installed"

      - name: 'Install and build client'
        run: |
          cd client
          npm install
          echo "✅ Client dependencies installed"
          npm run build
          echo "✅ React client built successfully"

      # Writes client/dist/<route>/index.html for every page, so a crawler that runs no
      # JavaScript is handed the rendered page instead of an empty <div id="root">. Uses the
      # runner's own Chrome; puppeteer-core is the driver only, with no browser download.
      # Deliberately non-blocking: a prerender that cannot run leaves the site as the plain SPA
      # it has always been, which is not a reason to stop a deploy.
      - name: 'Prerender pages'
        continue-on-error: true
        run: |
          npm install --no-save puppeteer-core
          node scripts/prerender.js
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

      # What the server actually answers: one canonical per address, a redirect from every
      # other hostname, 404 for an address the site does not have. This one does block — the
      # bugs it catches are invisible in a browser and cost the site its place in the index.
      - name: 'Check the site'
        run: |
          node scripts/stage-public.js
          node scripts/check-site.js
          rm -rf server/public

      - name: 'Create minimal deployment package'
        run: |
          mkdir -p deploy/server deploy/server/public

          cp -r server/. deploy/server/
          rm -rf deploy/server/node_modules

          cp -r client/dist/. deploy/server/public/

          # The page table the server reads to tell a page from a guessed path, and to answer
          # the router's own redirects with a 301. It lives in client/src, which is not deployed.
          cp client/src/seo/pages.json deploy/server/public/pages.json

          if [ -f web.config ]; then
            cp web.config deploy/
          fi

          if [ -f server/package-lock.json ]; then
            cp server/package-lock.json deploy/server/
          fi

          cp server/package.json deploy/server/

          (cd deploy/server && npm install --omit=dev)

          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const pkg = {
            name: 'aegisaosoft-app',
            version: '1.0.0',
            private: true,
            scripts: {
              start: 'node server/index.js'
            }
          };

          fs.writeFileSync(path.join('deploy', 'package.json'), JSON.stringify(pkg, null, 2));
          EOF

          echo "✅ Deployment package created"
          du -sh deploy/
          ls -la deploy/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AegisAOSoft'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}